version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: calendar_ai_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: calendar_ai
    ports:
      - "5434:5432" # Map host 5434 to container 5432 to avoid conflict with existing local DB
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
